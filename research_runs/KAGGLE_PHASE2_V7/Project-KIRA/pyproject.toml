[project]
name = "mcdl"
version = "0.1.0"
description = "Mastercard AI Defense Lab - adversarial payment-security laboratory"
requires-python = ">=3.10"

dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# Installed on Kaggle / for the full run. Kept out of the base install so the
# API container stays small and the Space build stays fast.
heavy = [
    "xgboost>=2.0",
    "shap>=0.45",
    "networkx>=3.2",
    "huggingface-hub>=0.23",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcdl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "slow: needs a generated world, not run in the fast unit suite",
]
